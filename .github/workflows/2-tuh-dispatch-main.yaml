name: Pipelines Compartidas

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar codigo
      uses: actions/checkout@v3

    - name: Login Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir y Publicar Imagen Apache
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/apache-client:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/apache-client:latest

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
    - name: Descargar codigo
      uses: actions/checkout@v3

    - name: Configurar Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

    - name: Desplegar en k3s
      run: |
        kubectl apply -f k8s/client.yaml
        kubectl rollout restart deployment/apache-deployment
