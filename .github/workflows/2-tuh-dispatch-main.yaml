name: ea2-lab-dispatch-main

on:
  workflow_dispatch: # Esto activa el botón manual "Run workflow" que sale en tu hoja

jobs:
  provisionar-infraestructura:
    uses: asanchezo-duoc/AUY1104-SharedWorkflows/.github/workflows/ea2-lab-dispatch-main.yaml@main
    with:
      aws_region: "us-east-1"
      instance_type: "t3.small"
      k8s_provider: "k3s"
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
