apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache-client
  template:
    metadata:
      labels:
        app: apache-client
    spec:
      containers:
      - name: apache-container
        image: fabian777omg/apache-client:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: apache-service
spec:
  type: NodePort
  selector:
    app: apache-client
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30100
